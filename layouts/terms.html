{{- define "main" }}
<div class="wrap taxonomy-list">
  <h1>{{ .Title }}</h1>
  <ul class="simple-list">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Term }}</a>
      <span class="simple-list-count">({{ .Count }})</span>
    </li>
    {{- end }}
  </ul>
</div>
{{- end }}
