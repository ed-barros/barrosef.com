baseURL = "https://barrosef.com/"
title = "Ed Barros"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[params]
  description = "Technology leadership — writing on engineering, systems and liberty."
  comments = true

  # Owner's professional facts. EVERY homepage block that uses these renders
  # only when its value is non-empty, so blanks are invisible, never brackets.
  [params.profile]
    positioning = ""      # hero headline; falls back to the default in home.html
    summary = ""          # one sentence under the headline
    currentRole = ""
    company = ""
    location = ""
    priorRoles = ""
    email = ""
    linkedin = "https://www.linkedin.com/in/barrosef/"

  # Track record. Empty list hides the whole band.
  # [[params.profile.metrics]]
  #   value = "12"
  #   label = "years leading engineering teams"

  [params.analytics]
    ga4 = ""

  [params.newsletter]
    kitFormId = ""

  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/barrosef/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/barrosef"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/barrosef2"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/barrosef/"
  [[params.socialIcons]]
    name = "tiktok"
    url = "https://www.tiktok.com/@barrosef"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/ed.barros.9231"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    contentDir = "content/en"
    weight = 1
    [[languages.en.menus.main]]
      name = "Writing"
      url = "/writing/"
      weight = 10
    [[languages.en.menus.main]]
      name = "About"
      url = "/about/"
      weight = 20
    [[languages.en.menus.main]]
      name = "Contact"
      url = "/contact/"
      weight = 30

  [languages.pt]
    languageName = "Português"
    languageCode = "pt-br"
    contentDir = "content/pt"
    weight = 2
    [[languages.pt.menus.main]]
      name = "Artigos"
      url = "/pt/artigos/"
      weight = 10
    [[languages.pt.menus.main]]
      name = "Sobre"
      url = "/pt/sobre/"
      weight = 20
    [[languages.pt.menus.main]]
      name = "Contato"
      url = "/pt/contato/"
      weight = 30
