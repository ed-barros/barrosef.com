name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.148.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
          sudo mv hugo /usr/local/bin/hugo

      - name: Translation mirror check
        run: python3 scripts/check_translations.py content

      - name: Build
        run: hugo --minify --gc

      - name: Internal link check (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir "${{ github.workspace }}/public" public/
          lycheeVersion: v0.24.2
          fail: true

      # continue-on-error swallows the failure at job level; fail: true still marks the step red so warnings stay visible
      - name: External link check (warn only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          # Social platforms throttle or hang on automated requests, which stalled
          # a deploy for 15+ minutes once the six profile links were added. They are
          # excluded here rather than tolerated: this step cannot block a deploy, so
          # its only job is to surface genuinely broken outbound links quickly.
          args: >-
            --no-progress --scheme https --scheme http
            --timeout 10 --max-retries 1 --max-concurrency 8
            --exclude 'linkedin\.com' --exclude 'instagram\.com'
            --exclude 'facebook\.com' --exclude 'tiktok\.com' --exclude 'x\.com'
            public/
          lycheeVersion: v0.24.2
          fail: true
        timeout-minutes: 5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
